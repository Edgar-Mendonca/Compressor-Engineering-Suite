name: Engineering suite

on:
  push:
    paths: ["suite/**", ".github/workflows/suite.yml"]
  pull_request:
    paths: ["suite/**", ".github/workflows/suite.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CalculiX (used by the FE cross-check test)
        run: sudo apt-get update && sudo apt-get install -y calculix-ccx
      - name: Install package
        run: pip install -e "suite/backend[test,coolprop]"
      - name: Tests
        working-directory: suite/backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build
        working-directory: suite/frontend
        run: |
          npm ci
          npm run build
